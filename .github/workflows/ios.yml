name: iOS build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          print(next(x['udid'] for r in sorted(d,reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
      - run: >
          set -o pipefail &&
          xcodebuild test -scheme RedMagicIce -destination "id=$SIM_UDID"
          CODE_SIGNING_ALLOWED=NO | tail -n 150
