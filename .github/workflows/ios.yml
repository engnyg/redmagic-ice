name: iOS build
on: [push, workflow_dispatch]
permissions:
  contents: write      # 發佈 Release(App 內更新提示讀取)
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          print(next(x['udid'] for r in sorted(d,reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
      - run: >
          set -o pipefail &&
          xcodebuild test -scheme RedMagicIce -destination "id=$SIM_UDID"
          CODE_SIGNING_ALLOWED=NO | tail -n 150
      - name: Build unsigned IPA
        run: |
          xcodebuild build -scheme RedMagicIce -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RedMagicIce.app Payload/
          zip -qr Cryo-unsigned.ipa Payload
          ls -la Cryo-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Cryo-unsigned-ipa
          path: Cryo-unsigned.ipa
      - name: Publish release (for in-app update check)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          NOTES=$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')
          gh release create "$TAG" Cryo-unsigned.ipa --target "${{ github.sha }}" \
            --title "極凍 Cryo build ${{ github.run_number }}" --notes "$NOTES" --latest
          # 只保留最近 10 個版本
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read t; do
            gh release delete "$t" --cleanup-tag -y || true
          done
