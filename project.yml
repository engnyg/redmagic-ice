name: RedMagicIce
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RedMagicIce:
    type: application
    platform: iOS
    sources: [RedMagicIce, Shared]
    dependencies:
      - target: RedMagicIceWidgets
    info:
      path: RedMagicIce/Info.plist
      properties:
        CFBundleDisplayName: 極凍
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # CI 以 run number 覆寫,App 內更新提示靠它比對
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 需要藍牙來連線並控制紅魔散熱器。
        UIBackgroundModes: [bluetooth-central]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.redmagicice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RedMagicIceWidgets:
    type: app-extension
    platform: iOS
    sources: [RedMagicIceWidgets, Shared]
    info:
      path: RedMagicIceWidgets/Info.plist
      properties:
        CFBundleDisplayName: 極凍
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # CI 以 run number 覆寫,App 內更新提示靠它比對
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.redmagicice.widgets
        SKIP_INSTALL: YES
  RedMagicIceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RedMagicIce
schemes:
  RedMagicIce:
    build:
      targets:
        RedMagicIce: all
    test:
      targets: [RedMagicIceTests]
